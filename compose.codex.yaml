services:
  codex-proxy:
    image: eceasy/cli-proxy-api:v8.0.64@sha256:362e7ac699a0f2608d7c55f8f8cb764e5afbfe4ed22aadc26fcb147eecbf2a03
    command:
      [
        "./CLIProxyAPI",
        "--config",
        "/run/eventroam/config.json",
        "--local-model",
      ]
    ports:
      - target: 8317
        host_ip: 127.0.0.1
    volumes:
      - type: bind
        source: ${EVENTROAM_CODEX_PROXY_DIRECTORY:?Run catalog:eval to prepare the current Codex login}
        target: /run/eventroam
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: none
