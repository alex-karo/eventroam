schema: spec-driven

context: |
  Eventroam is an English-language worldwide event catalog. Initial scope covers
  open-air music festivals and burning-like gatherings. The current Next.js app
  uses fictional development fixtures; ingestion and public deployment are deferred.
  Main specs describe implemented behavior. Approved future work belongs in
  active changes; unresolved decisions belong in docs/proposals/.
  Group spec capabilities under catalog/, website/, or operations/ by domain.
  Match each change delta's capability path to its main spec path.
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
