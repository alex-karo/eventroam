name: review-driven
version: 1
description: Spec-driven workflow with proportionate plans and clear engineering decisions
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.
      Start from the requested outcome and a concrete before/after example when useful.
      Distinguish requested outcomes, existing contracts and newly proposed guarantees.
      Writing a guarantee into a proposal or spec does not itself establish user acceptance.

      Sections:
      - **Why**: State the problem or opportunity and why it matters now.
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Name each capability for a durable system behavior (for example, `user-auth`), not the work in this change (for example, `add-login-endpoint`). Choose a cohesive boundary that can own related requirements as the system evolves; avoid broad catch-all capabilities. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. For each capability, add **Before** and **After** bullets, usually one short sentence each. State the current behavior from the main spec and the proposed behavior. Note any known difference between the main spec and the implementation. Describe only the behavior that changes; leave detailed conditions and scenarios in the delta spec. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for any that
      look related - that returns a capability's purpose and requirement texts
      without pulling whole spec files into context. Append `--store "<id>"` to
      both commands only for a registered standalone store, and keep `--type
      spec`: a change and a spec sharing a name is otherwise an ambiguous-item
      error. `openspec list` without `--specs` lists in-flight changes, not
      specs - it never shows what the project already covers. Reuse an existing
      capability's exact path instead of introducing a near-duplicate name.
      The filtered read is only an overview. Before deciding what is already
      covered or what should change, read each relevant spec in full, including
      scenarios, with `openspec show "<spec-id>" --type spec` (same `--store` rule).
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep implementation details in design.md.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec defines only behavior that a user, operator, or another system can
      observe. This includes public interfaces and operational results, not only UI.
      Trace significant new obligations to the requested outcome, an existing
      contract or an explicitly proposed decision. Do not turn an implementation
      convenience or a defensive assumption into a requirement merely to justify
      the chosen design. Resolve material scope choices before treating them as
      accepted implementation constraints.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Storage layout, private data shapes, and internal orchestration
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, the implementation choice does not belong in the spec.
      Keep data shapes and signatures in code. Link to their source definitions
      when needed; use the design's Contracts section for proposed code changes.
      Keep observable validation rules, errors, and value meaning in the spec.
      Public names and values belong here when consumers depend on them.

      Use consistent domain terms. Give each requirement a name that states its
      behavior. Give each scenario a concrete trigger and observable result.
      Include failure and boundary cases when they define different behavior;
      do not enumerate internal branches. Avoid vague results such as "works
      correctly". Require exact UI text only when that text is part of the contract.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta, appending `--store "<id>"` only for a registered standalone store - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - Keep each requirement's description (the text between `### Requirement:` and its first scenario) to 500 characters or fewer. `openspec validate` flags longer descriptions once they reach the main spec. This is an informational hint, not an error. When writing a new requirement, state one behavior per requirement: move examples and edge cases into scenarios, and split a requirement that covers several behaviors into separate `### Requirement:` blocks, each with its own scenarios. Under MODIFIED, keep the existing requirement block whole; never split, trim or rewrite existing text just to meet the length.

      New capabilities only: the delta spec's first section is `## Purpose` -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create design.md for every change, including small changes.
      Explain the technical solution so a reviewer can assess it before implementation.
      Keep TL;DR first. Add detail sections only when they help explain the solution,
      its reasons, or its risks. A simple design can contain only TL;DR.

      Sections:
      - TL;DR: Give a compact, structured overview of the whole solution.
        Show the intended result, core idea, and main flow or responsibilities.
        Include a constraint or trade-off only when it is needed to understand the solution.
        Use labeled bullets, short paragraphs, or a small Mermaid diagram as needed.
        Combine text and a diagram when useful. Do not require fixed labels or a diagram.
        Make the overview clear without reading code or later sections.
        Put supporting detail in the sections below. Link to the proposal and specs
        for full motivation and behavior rules.
      - Contracts: Show changed data shapes and signatures as short fenced code
        blocks with a language tag. Use TypeScript for application types. Mark code
        that is proposed and link to existing source definitions. Show before/after
        only when it helps explain the change. Code owns the exact structure; do
        not repeat fields in prose or copy full schemas. Add brief prose only for
        semantics the code cannot express, such as omission versus null. Reference
        specs for observable validation rules and errors. Cover stored-data
        transitions only when relevant. Omit this section if contracts do not change.
      - Architecture: Show the execution or data flow, module boundaries, and ownership
        of decisions, validation, and writes. Name removed paths or abstractions.
        Use a small Mermaid diagram when it makes boundaries, flow, or ownership
        easier to understand. Use a sequence diagram when order matters. Label
        components and interactions; omit private helpers. Explain only what the
        diagram does not show. Omit this section if the structure is already clear.
      - Key decisions: State each important choice, its reason, and material trade-offs.
        For significant custom mechanisms, identify the concrete scenario and consumer,
        the source of the requirement, and why existing capabilities are insufficient.
        Justify application-owned copies of dependency rules or data, even when small.
        For defensive layers, name the real input path and existing safeguards;
        API availability alone does not establish application support.
        Separate requested or accepted guarantees from new proposals and assumptions.
        Distinguish required design decisions from details left to implementation.
        Do not prescribe private helpers or repeat full implementation schemas.
        Discuss useful simpler options beside the decision they affect. Explain the
        choice between options that keep the same requirements. For scope reductions,
        name the lost or deferred behavior, affected consumers, and implementation
        and test work avoided. These are proposals, not permission to change requirements.
        Compare removing a mechanism with reorganizing it; check actual dependency
        capabilities before retaining application-owned copies of their rules.
        Do not reject a simpler option solely because a newly drafted spec requires
        the more complex behavior. Omit alternatives when none are useful.
      - Risks and validation: Connect each material risk to a focused check or evidence.
        Include migration, recovery, or rollout details only when needed.
        List only open questions that cannot change requirements, the solution, or tasks.
        Resolve questions that would change those with the user before writing tasks.

      Scale detail to actual risk and uncertainty. Explain the main flow, what
      existing components or dependencies already do, and what the application
      adds where needed. Cover data transitions, dependencies, and intermediate
      validation only when they affect a decision. Use no size categories or
      section quotas. Keep TL;DR short; put necessary detail in its owning section.

      Keep design.md as one coherent description of the current solution.
      Fold corrections into the relevant sections. Do not append correction logs.
      Update affected proposal, specs, and tasks when an approved decision changes.
      Write or revise TL;DR after the detailed design. Keep it first in the file.
      Check that it agrees with the details and introduces no conflicting decisions.
      Before handoff, check the outcome, main flow, ownership, and reasons for added mechanisms.
      Add missing explanations to their relevant sections. Update TL;DR when the core idea changes.
      Remove text that does not help assess or implement the design.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. A box holding only `x` counts as done,
      upper or lower case and with any spacing, so `- [ x]` is done too. Every
      other marker, including `- [~]`, `- [-]` and an empty `- []`, reads as
      unfinished. A line with no checkbox is not tracked at all.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.
      - Each task group MUST land the tests and documentation its own work
        calls for. Do NOT collect testing or documentation into a final group -
        when a late group first exercises work from an early one, the failures
        cascade back through every group in between and force rework. A group
        whose work calls for neither, such as scaffolding or dependency setup,
        carries neither. A final group is for integration checks only, not for
        the tests and docs an earlier group owed.

      Example:
      ```
      # Tasks

      ## 1. Setup

      - [ ] 1.1 Create new module structure and verify expected files are present
      - [ ] 1.2 Add dependencies to package.json and verify package installation succeeds

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters
      - [ ] 2.3 Document the export API in docs/export.md and verify the documented command runs as written
      ```

      Reference specs for what needs to be built, design for how to build it.

      Match task detail to scope, dependencies, and material risks in design.md.
      Use a few focused steps for a simple change. Group related outcomes when
      needed, with explicit dependencies and intermediate validation for work
      that spans components. Use no size categories, fixed task counts, or time estimates.
      Each task should describe one reviewable outcome and how to check it. Do not hide
      many unrelated actions in a long checkbox to make the plan look short. Reference
      design details and spec scenarios instead of repeating them in each task.
      For proposed test scenarios, identify a meaningful failure they would detect
      and check existing coverage before adding fixtures or another integration matrix.
      Prefer testing the application's use of a dependency over reproducing its own
      algorithm tests, unless an explicit contract or integration risk calls for it.
      Reassess the plan when scope, dependencies, or risk changes.

      Before presenting a substantive plan as ready, follow the repository's
      plan-review skill at .agents/skills/plan-review/SKILL.md for review and reporting.
      Apply supported revisions within the authorized planning scope after review.
      Do not add a review artifact or start implementation.
    requires:
      - specs
      - design

apply:
  requires: [ design, tasks ]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
