name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify runtime
        run: |
          test "$(node --version)" = "v26.11.1"
          test "$(pnpm --version)" = "12.15.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run lint
      - run: pnpm run deps:check
      - run: pnpm run format:check
      - run: pnpm run docs:check
      - run: pnpm run test:db-transfer
      - run: pnpm run test:backup
      - run: pnpm run test:openspec
      - name: Validate active change plans
        run: pnpm run openspec:validate -- --draft
      - run: pnpm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          retention-days: 14
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.7.1
      - name: Build images and check Compose
        run: pnpm run docker:smoke

  code-health:
    name: Repowise code health
    if: github.event_name == 'pull_request' || (!github.event.created && !github.event.deleted)
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: repowise-dev/repowise@b9e9f97eb368ecdbf93fb57b11a5b9de53961b0b # v0.62.0
        env:
          REPOWISE_OFFLINE: '1'
        with:
          version: '0.62.0'
          checks: health
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          base: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}...HEAD', github.event.pull_request.base.sha)
                || format('{0}..HEAD', github.event.before) }}
