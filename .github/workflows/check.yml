name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify runtime
        run: |
          test "$(node --version)" = "v26.11.1"
          test "$(pnpm --version)" = "12.15.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run lint
      - run: pnpm run deps:check
      - run: pnpm run format:check
      - run: pnpm run docs:check
      - run: pnpm run test:db-transfer
      - name: Validate implemented OpenSpec specs
        run: pnpm exec openspec validate --specs --strict
      - run: pnpm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          retention-days: 14
      - name: Build images and check Compose
        run: pnpm run docker:smoke
